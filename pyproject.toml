[project]
name = "canonhq"
version = "1.61.0"
description = "Canon — spec-driven development platform"
readme = "README.md"
requires-python = ">=3.12"
license = "BUSL-1.1"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "anthropic>=0.43",
    "httpx>=0.28",
    "python-frontmatter>=1.1",
    "mistune>=3.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "jinja2>=3.1",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "cryptography>=44.0",
    "PyJWT[crypto]>=2.9",
    "mcp[cli]>=1.7",
    "posthog>=3.7",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.urls]
Homepage = "https://canonhq.co"
Repository = "https://github.com/canonhq/canon"
Issues = "https://github.com/canonhq/canon/issues"

[project.optional-dependencies]
server = [
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "sqlalchemy[asyncio]>=2.0",
    "slack-bolt>=1.20.0",
    "slack-sdk>=3.30.0",
    "aiohttp>=3.9",
]
cloud = [
    "canonhq[server]",
    "google-genai>=1.0",
    "stripe>=11.0",
    "opensearch-py>=2.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.35",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
canon = "canon.cli:main"
canon-mcp = "canon.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canon"]

[tool.hatch.build.targets.sdist]
exclude = [
  "docs-site/",
  "frontend/",
  ".claude/",
  ".claude-plugin/",
  "chart/",
  "infra/",
  "extensions/",
  "oss/",
  "static/",
  "templates/",
  "actions/",
  "scripts/",
  ".github/",
  "Dockerfile",
  "Dockerfile.dev",
  "devspace.yaml",
  "Makefile",
  ".mcp.json",
  "github-app-manifest.json",
]

[tool.hatch.build.targets.sdist.force-include]
"plugin/skills" = "plugin/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
# auto-mode: async test functions run without explicit @pytest.mark.asyncio
asyncio_mode = "auto"
markers = [
    "integration: integration tests (deselected by default)",
    "scenario: scenario-based adoption lifecycle tests (deselected by default)",
]
addopts = "-m 'not integration and not scenario'"

[tool.coverage.run]
source = ["canon"]
branch = true
parallel = true

[tool.coverage.paths]
source = ["src/canon", "*/canon"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
upload_to_vcs_release = false

[tool.semantic_release.branches.main]
match = "main"
