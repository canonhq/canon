## Preview deployment overrides — ephemeral per-PR namespace
##
## NOTE: Preview uses the shared database with full RW access.
## "Read-only" is by convention (cron jobs disabled, no webhook processing)
## not by enforcement. Do not enable cron jobs or webhook processing in
## previews without scoping DB access first.
## Usage: helm upgrade --install canon-pr-N chart/canon/ \
##   -f chart/canon/values-production.yaml \
##   -f chart/canon/values-preview.yaml \
##   --set ingress.hostname=pr-N.canonhq.co \
##   --set image.tag=pr-N \
##   -n canon-preview-N --create-namespace

replicaCount: 1

# Preview reuses the same image tag (pr-N) across pushes, so Always is
# required to pick up rebuilt images on each deploy.
image:
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  hostname: ""  # set via --set at deploy time
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    # No CPU limit — avoids kernel CFS throttling (K8s best practice for burstable pods)
    memory: 256Mi

# Disable all cron jobs — previews are read-only UI
cronJob:
  enabled: false
reindexCronJob:
  enabled: false
staleCheckCronJob:
  enabled: false
coverageSnapshotCronJob:
  enabled: false
weeklyDigestCronJob:
  enabled: false
staleSpecsCronJob:
  enabled: false
teamDigestCronJob:
  enabled: false
auditRetentionCronJob:
  enabled: false
refreshTokensCronJob:
  enabled: false
contentReconcileCronJob:
  enabled: false
opensearchReconcileCronJob:
  enabled: false

# OpenSearch is production-only. The canon-opensearch K8s secret only
# lives in the canon namespace (synced from Doppler), so preview pods
# would CrashLoopBackOff on a missing-secret config error. Search falls
# back to the pgvector + ParadeDB path automatically when this is off.
opensearch:
  enabled: false

# Slack is production-only. Without this override the chart inherits
# secrets.slack.existingSecret from values-production.yaml, causing a
# CreateContainerConfigError because canon-slack doesn't exist in
# preview namespaces.
secrets:
  slack:
    existingSecret: ""

config:
  environment: "preview"
  webOrg: "canonhq"
