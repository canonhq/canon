## @section Content reconciliation CronJob parameters
## @param contentReconcileCronJob.enabled Enable content reconciliation CronJob
## @param contentReconcileCronJob.schedule Cron schedule expression (default: every 30 min)
## @param contentReconcileCronJob.concurrencyPolicy CronJob concurrency policy
contentReconcileCronJob:
  enabled: false
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid

## @param opensearchReconcileCronJob.enabled Enable OpenSearch reconciliation CronJob
## @param opensearchReconcileCronJob.schedule Cron schedule expression (default: hourly)
## @param opensearchReconcileCronJob.concurrencyPolicy CronJob concurrency policy
## @param opensearchReconcileCronJob.backoffLimit Max retries before the job is marked failed
## @param opensearchReconcileCronJob.activeDeadlineSeconds Hard timeout for a single run
## @param opensearchReconcileCronJob.successfulJobsHistoryLimit Successful job pods retained
## @param opensearchReconcileCronJob.failedJobsHistoryLimit Failed job pods retained
## @param opensearchReconcileCronJob.startingDeadlineSeconds Window before a missed run is dropped
## @param opensearchReconcileCronJob.resources Resource requests/limits sized for batch reconcile (independent of API server resources)
opensearchReconcileCronJob:
  enabled: false
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  # Each retry re-embeds mismatched specs (Vertex AI cost). 1 retry on
  # transient failure is enough; the cron runs hourly so a stuck retry
  # loop is the worse failure mode than a single-run miss.
  backoffLimit: 1
  # 30m is well above a healthy reconcile run; cuts off an OOM-loop or
  # network hang before the next hour fires.
  activeDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

