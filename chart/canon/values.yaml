## @section Application configuration
## @param config.port Server port
## @param config.logLevel Log level (debug, info, warning, error)
## @param config.webhookPath Webhook endpoint path
## @param config.webOrg Default GitHub org for the web UI dashboard
## @param config.cacheTtlSeconds In-memory cache TTL in seconds
## @param config.posthogHost PostHog ingest host
## @param config.posthogLogsEnabled Enable OTel log export to PostHog
## @param config.posthogLogsMinLevel Minimum log level for OTel export
config:
  port: 3000
  logLevel: "info"
  webhookPath: "/webhook"
  webOrg: ""
  cacheTtlSeconds: 300
  posthogHost: "https://us.i.posthog.com"
  posthogLogsEnabled: "false"
  posthogLogsMinLevel: "WARNING"
  platformUrl: ""
  environment: "development"
  ## Auth0 Organizations mode — when true, permissions come from JWT claims
  ## and org_id enables tenant isolation (cloud multi-tenant).
  ## When false (default), permissions fall back to DB role lookup (single-tenant / OSS).
  auth0OrgsEnabled: "false"
  ## SRE alerting config
  sreAlertsEnabled: "true"
  sreErrorSpikeThreshold: "10"
  sreErrorSpikeWindow: "300"
  sreSlowQueryThresholdMs: "500"
  sreAutoTriageEnabled: "true"
  sreWeeklyDigestEnabled: "false"
  deploymentMode: "development"
  adminAuditRetentionDays: "90"

