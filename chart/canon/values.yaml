## @section Zitadel (optional — bundled identity provider for self-hosting)
## @section OpenSearch parameters
## Canon can use OpenSearch for full-text + vector search. Choose one mode:
##   - external: connect to a managed cluster (DO, AWS, self-managed)
##   - internal: deploy OpenSearch in-cluster via subchart (self-hosted)
## Both modes set OPENSEARCH_URL/USERNAME/PASSWORD on the Canon deployment.

## @param opensearch.enabled Enable OpenSearch integration (read path)
## @param opensearch.external.url URL of an external OpenSearch cluster
## @param opensearch.external.username External cluster username
## @param opensearch.external.password External cluster password
## @param opensearch.internal.enabled Deploy OpenSearch in-cluster (subchart)
## @param opensearch.internal.replicas Number of OpenSearch nodes
## @param opensearch.internal.persistence.size PVC size per node
## @param opensearch.internal.resources.requests.memory Memory request per node
## @param opensearch.internal.resources.requests.cpu CPU request per node
opensearch:
  enabled: false

  # Use an existing K8s Secret for OpenSearch credentials instead of
  # generating one. The secret must contain OPENSEARCH_USERNAME and
  # OPENSEARCH_PASSWORD keys. Recommended for production.
  existingSecret: ""

  # Option A: Connect to an external managed OpenSearch cluster
  external:
    url: ""
    username: ""
    password: ""

  # Option B: Deploy OpenSearch in-cluster (self-hosted users)
  # NOTE: username/password must be set explicitly when internal.enabled=true.
  # No defaults are provided to avoid shipping known credentials.
  internal:
    enabled: false
    replicas: 1
    username: ""
    password: ""
    persistence:
      size: 10Gi
    resources:
      requests:
        memory: 1Gi
        cpu: 500m

  # Index settings (shared across both modes)
  specsIndex: "canon-specs"
  sectionsIndex: "canon-sections"

  # ─── Subchart overrides (opensearch-project/helm-charts) ───────────
  # These values pass through to the OpenSearch subchart when
  # opensearch.internal.enabled=true. Override as needed.
  # See: https://github.com/opensearch-project/helm-charts
  singleNode: true
  replicas: 1
  opensearchJavaOpts: "-Xmx512m -Xms512m"
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1536Mi
  config:
    opensearch.yml: |
      # Security is enabled by default. Configure TLS certificates for production
      # use. See https://opensearch.org/docs/latest/security/
      # To disable security (NOT recommended for production), set:
      #   plugins.security.disabled: true
      plugins.security.disabled: false
      cluster.name: canon-search
      network.host: 0.0.0.0

## @section Zitadel subchart parameters
## @param zitadel.enabled Deploy Zitadel alongside Canon
## @param zitadel.setup Enable Zitadel auto-provisioning job (creates Canon project, web app, device app)
## @param zitadel.setupImage Container image for the setup job (needs curl, kubectl, jq)
## @param zitadel.adminClientId Zitadel service account client ID for setup job (required when setup=true)
## @param zitadel.adminSecretName K8s secret containing key "client-secret" for the admin SA (required when setup=true)
zitadel:
  enabled: false
  setup: false
  setupImage: "dtzar/helm-kubectl:3.16@sha256:732b9752c447ce91cbd908c15f9f450e2d94cd3cfec47ce1072956df532cb0bf"
  adminClientId: ""
  adminSecretName: ""
  # Upstream Zitadel Helm chart values pass through here
  # See: https://github.com/zitadel/zitadel-charts
