apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canon.fullname" . }}
  labels:
    {{- include "canon.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  WEBHOOK_PATH: {{ .Values.config.webhookPath | quote }}
  WEB_ORG: {{ .Values.config.webOrg | quote }}
  CACHE_TTL_SECONDS: {{ .Values.config.cacheTtlSeconds | quote }}
  POSTHOG_HOST: {{ .Values.config.posthogHost | quote }}
  POSTHOG_LOGS_ENABLED: {{ .Values.config.posthogLogsEnabled | quote }}
  POSTHOG_LOGS_MIN_LEVEL: {{ .Values.config.posthogLogsMinLevel | quote }}
  {{- if .Values.config.platformUrl }}
  PLATFORM_URL: {{ .Values.config.platformUrl | quote }}
  {{- end }}
  {{- if .Values.config.environment }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  {{- end }}
  AUTH0_ORGS_ENABLED: {{ .Values.config.auth0OrgsEnabled | quote }}
  SRE_ALERTS_ENABLED: {{ .Values.config.sreAlertsEnabled | quote }}
  SRE_ERROR_SPIKE_THRESHOLD: {{ .Values.config.sreErrorSpikeThreshold | quote }}
  SRE_ERROR_SPIKE_WINDOW: {{ .Values.config.sreErrorSpikeWindow | quote }}
  SRE_SLOW_QUERY_THRESHOLD_MS: {{ .Values.config.sreSlowQueryThresholdMs | quote }}
  SRE_AUTO_TRIAGE_ENABLED: {{ .Values.config.sreAutoTriageEnabled | quote }}
  SRE_WEEKLY_DIGEST_ENABLED: {{ .Values.config.sreWeeklyDigestEnabled | quote }}
  DEPLOYMENT_MODE: {{ .Values.config.deploymentMode | quote }}
  ADMIN_AUDIT_RETENTION_DAYS: {{ .Values.config.adminAuditRetentionDays | quote }}
  PROFILE_HUB_ENABLED: {{ .Values.config.profileHubEnabled | quote }}
  {{- /*
    Use ne (toString …) "" instead of a bare truthiness check: Go templates
    treat the YAML boolean `false` (unquoted) as falsy, which would silently
    skip injection when an operator wants to explicitly disable the override.
    With toString-coerce, only the empty-string sentinel "" means "unset";
    "false" / "true" / any other value gets through to the env var.
  */}}
  {{- if ne (toString .Values.slack.workContextEnabledOverride) "" }}
  SLACK_WORK_CONTEXT_ENABLED_OVERRIDE: {{ .Values.slack.workContextEnabledOverride | toString | quote }}
  {{- end }}
