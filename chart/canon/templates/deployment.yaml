apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canon.fullname" . }}
  labels:
    {{- include "canon.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "canon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "canon.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "canon.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "canon.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "canon.fullname" . }}
            - secretRef:
                name: {{ include "canon.githubSecretName" . }}
            - secretRef:
                name: {{ include "canon.anthropicSecretName" . }}
          {{- if or .Values.secrets.neon.databaseUrl .Values.secrets.neon.existingSecret }}
            - secretRef:
                name: {{ include "canon.neonSecretName" . }}
          {{- end }}
          {{- if or .Values.secrets.gcp.serviceAccountKey .Values.secrets.gcp.existingSecret }}
            - secretRef:
                name: {{ include "canon.gcpSecretName" . }}
          {{- end }}
          {{- if or .Values.secrets.githubTickets.token .Values.secrets.githubTickets.existingSecret }}
            - secretRef:
                name: {{ include "canon.githubTicketsSecretName" . }}
          {{- end }}
          {{- if or .Values.secrets.jira.host .Values.secrets.jira.existingSecret }}
            - secretRef:
                name: {{ include "canon.jiraSecretName" . }}
          {{- end }}
          {{- if or .Values.secrets.auth0.domain .Values.secrets.auth0.existingSecret }}
            - secretRef:
                name: {{ include "canon.auth0SecretName" . }}
          {{- end }}
          {{- if or .Values.secrets.oidc.existingSecret (and .Values.secrets.oidc.issuer .Values.secrets.oidc.clientId .Values.secrets.oidc.clientSecret) }}
            - secretRef:
                name: {{ include "canon.oidcSecretName" . }}
          {{- end }}
          {{- if or .Values.secrets.mcp.apiKey .Values.secrets.mcp.existingSecret }}
            - secretRef:
                name: {{ include "canon.mcpSecretName" . }}
          {{- end }}
          {{- if or .Values.secrets.posthog.apiKey .Values.secrets.posthog.existingSecret }}
            - secretRef:
                name: {{ include "canon.posthogSecretName" . }}
          {{- end }}
          {{- if or .Values.secrets.slack.webhookUrl .Values.secrets.slack.existingSecret }}
            - secretRef:
                name: {{ include "canon.slackSecretName" . }}
          {{- end }}
          {{- if or .Values.secrets.stripe.secretKey .Values.secrets.stripe.existingSecret }}
            - secretRef:
                name: {{ include "canon.stripeSecretName" . }}
          {{- end }}
          {{- if or .Values.secrets.smtp.host .Values.secrets.smtp.existingSecret }}
            - secretRef:
                name: {{ include "canon.smtpSecretName" . }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
