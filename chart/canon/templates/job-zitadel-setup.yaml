{{- if and .Values.zitadel.enabled .Values.zitadel.setup }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "canon.fullname" . }}-zitadel-setup
  labels:
    {{- include "canon.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "canon.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "WARNING: Zitadel setup job is not yet implemented"
              echo "TODO: Create Canon project, web app, device app"
              echo "TODO: Write client credentials to K8s secret"
              echo "Set zitadel.setup=false to suppress this job"
              exit 0
{{- end }}
