{{- if .Values.contentReconcileCronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "canon.fullname" . }}-content-reconcile
  labels:
    {{- include "canon.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.contentReconcileCronJob.schedule | quote }}
  concurrencyPolicy: {{ .Values.contentReconcileCronJob.concurrencyPolicy }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "canon.selectorLabels" . | nindent 12 }}
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "canon.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          restartPolicy: OnFailure
          containers:
            - name: content-reconcile
              image: {{ include "canon.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "canon.cron.content_reconcile"]
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: {{ include "canon.fullname" . }}
                - secretRef:
                    name: {{ include "canon.githubSecretName" . }}
                - secretRef:
                    name: {{ include "canon.anthropicSecretName" . }}
              {{- if or .Values.secrets.neon.databaseUrl .Values.secrets.neon.existingSecret }}
                - secretRef:
                    name: {{ include "canon.neonSecretName" . }}
              {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
