{{- /*
Verify that every required secret reference in the deployment is actually
mounted (i.e. envFrom rendered, K8s Secret exists, and the expected env
var inside the pod is non-empty).

Background: PR #701 fixed a bug where the `canon-slack` Secret existed in
production (populated by Doppler) but the chart's conditional secretRef
silently rendered to nothing because production values had no
`secrets.slack.existingSecret` entry. The bot was broken for 41 days
before anyone tried `/canon status`.

This test would have caught it at deploy time — `helm test` would have
failed before the upgrade was acknowledged.

Usage: `helm test <release> -n <namespace>` after `helm upgrade`.
The test passes if every expected env var is present and non-empty.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "canon.fullname" . }}-test-secret-mount"
  labels:
    {{- include "canon.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: secret-mount-check
      image: busybox:1.36
      # Use the SAME envFrom block as the main canon container so this test
      # exercises the actual chart-rendered references. If a secret ref is
      # missing or pointing at a non-existent Secret, the pod fails to start
      # with CreateContainerConfigError — `helm test` reports failure.
      envFrom:
        - configMapRef:
            name: {{ include "canon.fullname" . }}
        - secretRef:
            name: {{ include "canon.githubSecretName" . }}
        - secretRef:
            name: {{ include "canon.anthropicSecretName" . }}
        {{- if or .Values.secrets.neon.databaseUrl .Values.secrets.neon.existingSecret }}
        - secretRef:
            name: {{ include "canon.neonSecretName" . }}
        {{- end }}
        {{- if or .Values.secrets.gcp.serviceAccountKey .Values.secrets.gcp.existingSecret }}
        - secretRef:
            name: {{ include "canon.gcpSecretName" . }}
        {{- end }}
        {{- if or .Values.secrets.auth0.domain .Values.secrets.auth0.existingSecret }}
        - secretRef:
            name: {{ include "canon.auth0SecretName" . }}
        {{- end }}
        {{- if or .Values.secrets.posthog.apiKey .Values.secrets.posthog.existingSecret }}
        - secretRef:
            name: {{ include "canon.posthogSecretName" . }}
        {{- end }}
        {{- if or .Values.secrets.slack.webhookUrl .Values.secrets.slack.botToken .Values.secrets.slack.existingSecret }}
        - secretRef:
            name: {{ include "canon.slackSecretName" . }}
        {{- end }}
        {{- if or .Values.secrets.stripe.secretKey .Values.secrets.stripe.existingSecret }}
        - secretRef:
            name: {{ include "canon.stripeSecretName" . }}
        {{- end }}
        {{- if or .Values.secrets.smtp.host .Values.secrets.smtp.existingSecret }}
        - secretRef:
            name: {{ include "canon.smtpSecretName" . }}
        {{- end }}
        {{- if or .Values.secrets.integrations.existingSecret .Values.secrets.integrations.jiraOauthClientId }}
        - secretRef:
            name: {{ .Values.secrets.integrations.existingSecret | default (printf "%s-integrations" (include "canon.fullname" .)) }}
        {{- end }}
      command:
        - /bin/sh
        - -c
        - |
          set -e
          # Per-secret expected env var. Each line is "<source>:<env_var>".
          # Add a line when a new secret stanza ships with a well-known key.
          # The check passes if the env var is set AND non-empty.
          checks=""
          checks="$checks github:GITHUB_APP_PRIVATE_KEY"
          checks="$checks anthropic:ANTHROPIC_API_KEY"
          {{- if or .Values.secrets.neon.databaseUrl .Values.secrets.neon.existingSecret }}
          checks="$checks neon:DATABASE_URL"
          {{- end }}
          {{- if or .Values.secrets.auth0.domain .Values.secrets.auth0.existingSecret }}
          checks="$checks auth0:AUTH0_DOMAIN"
          {{- end }}
          {{- if or .Values.secrets.posthog.apiKey .Values.secrets.posthog.existingSecret }}
          checks="$checks posthog:POSTHOG_KEY"
          {{- end }}
          {{- if or .Values.secrets.slack.webhookUrl .Values.secrets.slack.botToken .Values.secrets.slack.existingSecret }}
          checks="$checks slack:SLACK_BOT_TOKEN"
          {{- end }}

          failed=""
          for entry in $checks; do
            source="${entry%:*}"
            envvar="${entry#*:}"
            value=$(eval echo "\$$envvar")
            if [ -z "$value" ]; then
              echo "FAIL: $source secret is mounted but $envvar is empty"
              failed="$failed $source"
            else
              echo "OK:   $source ($envvar set, ${#value} chars)"
            fi
          done

          if [ -n "$failed" ]; then
            echo ""
            echo "Failed checks:$failed"
            echo "This usually means the K8s Secret exists but is missing"
            echo "the expected key, or Doppler hasn't synced yet."
            exit 1
          fi
          echo ""
          echo "All required secrets are mounted with non-empty values."
