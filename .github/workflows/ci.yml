name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy src/canon --ignore-missing-imports

      - name: Test
        run: uv run pytest --tb=short -q
